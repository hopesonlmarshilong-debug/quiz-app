<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Quiz Battle Arena</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="quiz-container">

        <div class="quiz-header">

            <h2>
                Welcome,
                <span id="username"></span>
            </h2>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <h1>⚔️ Quiz Battle Arena</h1>

        <div class="progress">
            Question
            <span id="currentQuestion">1</span>/15
        </div>

        <div class="timer">
            ⏱ Time Left:
            <span id="timer">15</span>s
        </div>

        <h2 id="question"></h2>

        <div id="answers" class="answers"></div>

        <button id="nextBtn">
            Next Question
        </button>

    </div>

    <script src="js/quiz.js"></script>

</body>
</html>
